name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

      - name: Trigger Vercel Production Deployment
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          VERCEL_ORG_ID: team_A0kVH0DutkXU36FYUh3sAcMz
          VERCEL_PROJECT_ID: prj_UEBOP3VOvX68CeOVLY0CTAshzgsj
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
            npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
            npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          fi

